<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#330006"/>
      <stop offset="70%" stop-color="#100204"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff3355"/>
      <stop offset="70%" stop-color="#e60026"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background disk -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)"/>
  
  <!-- Outer metallic neon red rings -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#e60026" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#ff2a4b" stroke-width="0.8" stroke-dasharray="3 2"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#770a18" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#ff1e42" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.6"/>

  <!-- Compass / Crosshair ticks -->
  <line x1="50" y1="2" x2="50" y2="10" stroke="#ff3355" stroke-width="1.8"/>
  <line x1="50" y1="90" x2="50" y2="98" stroke="#ff3355" stroke-width="1.8"/>
  <line x1="2" y1="50" x2="10" y2="50" stroke="#ff3355" stroke-width="1.8"/>
  <line x1="90" y1="50" x2="98" y2="50" stroke="#ff3355" stroke-width="1.8"/>

  <!-- Core Radiant Star / Diamond Emblem -->
  <!-- Outer Star Diamond -->
  <path d="M50 18 Q50 45 68 50 Q50 55 50 82 Q50 55 32 50 Q50 45 50 18 Z" fill="#150104" stroke="#e60026" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Inner Radiant Star Diamond -->
  <path d="M50 24 Q50 46 64 50 Q50 54 50 76 Q50 54 36 50 Q50 46 50 24 Z" fill="url(#starGlow)"/>
  <path d="M50 33 Q50 48 58 50 Q50 52 50 67 Q50 52 42 50 Q50 48 50 33 Z" fill="#ffffff"/>
  
  <!-- Central Sparkle Point -->
  <circle cx="50" cy="50" r="2" fill="#ffffff" filter="url(#glow)"/>
</svg>
