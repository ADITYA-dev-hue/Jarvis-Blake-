<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGRIS Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="companion-root" id="companionRoot">
    
    <!-- DRAGGABLE WRAPPER -->
    <div class="drag-container" id="dragContainer">
      
      <!-- SPEECH / STATUS BUBBLE -->
      <div class="speech-bubble" id="speechBubble">
        <div class="bubble-header">
          <span class="bubble-title">IGRIS</span>
          <span class="bubble-badge" id="bubbleStateBadge">IDLE</span>
        </div>
        <div class="bubble-content" id="bubbleContent">Standing by, Commander.</div>
      </div>

      <!-- 2.5D CHARACTER STAGE -->
      <div class="character-stage" id="characterStage">
        <canvas id="particlesCanvas"></canvas>

        <!-- LAYER 1: GROUND HOLOGRAM CIRCLE -->
        <div class="rig-layer layer-aura" id="layerAura">
          <div class="hologram-circle">
            <div class="hologram-inner"></div>
          </div>
        </div>

        <!-- LAYER 2: SHADOW CAPE (BACK) -->
        <div class="rig-layer layer-cape" id="layerCape">
          <svg class="char-svg" viewBox="0 0 200 300">
            <defs>
              <linearGradient id="capeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#141822"/>
                <stop offset="70%" stop-color="#0c0e14"/>
                <stop offset="100%" stop-color="#ff1a3c" stop-opacity="0.8"/>
              </linearGradient>
            </defs>
            <path d="M 70 80 Q 40 140 25 240 Q 50 220 70 250 Q 85 210 100 240 Q 115 210 130 250 Q 150 220 175 240 Q 160 140 130 80 Z" 
                  fill="url(#capeGrad)" stroke="#ff1a3c" stroke-width="1.5" stroke-dasharray="6 3"/>
          </svg>
        </div>

        <!-- LAYER 3: LEGS & GREAVES -->
        <div class="rig-layer layer-legs" id="layerLegs">
          <svg class="char-svg" viewBox="0 0 200 300">
            <path d="M 82 175 L 75 235 L 70 270 L 88 270 L 92 235 L 94 175 Z" fill="#1b202c" stroke="#2c3345" stroke-width="2"/>
            <line x1="84" y1="185" x2="79" y2="250" stroke="#ff1a3c" stroke-width="1.8"/>
            <path d="M 106 175 L 108 235 L 112 270 L 130 270 L 125 235 L 118 175 Z" fill="#1b202c" stroke="#2c3345" stroke-width="2"/>
            <line x1="116" y1="185" x2="121" y2="250" stroke="#ff1a3c" stroke-width="1.8"/>
          </svg>
        </div>

        <!-- LAYER 4: TORSO & CHESTPLATE -->
        <div class="rig-layer layer-torso" id="layerTorso">
          <svg class="char-svg" viewBox="0 0 200 300">
            <defs>
              <linearGradient id="armorMetal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#323b4e"/>
                <stop offset="50%" stop-color="#1e2432"/>
                <stop offset="100%" stop-color="#11141c"/>
              </linearGradient>
            </defs>
            <polygon points="75,85 125,85 135,130 115,175 85,175 65,130" fill="url(#armorMetal)" stroke="#3e4960" stroke-width="2"/>
            <path d="M 100 95 L 100 155 M 82 110 L 100 130 L 118 110 M 88 150 L 100 160 L 112 150" 
                  stroke="#ff1a3c" stroke-width="2.2" fill="none"/>
            <polygon points="100,122 108,130 100,138 92,130" fill="#ffffff" id="coreGem"/>
          </svg>
        </div>

        <!-- LAYER 5: SHOULDERS & ARMS -->
        <div class="rig-layer layer-shoulders" id="layerShoulders">
          <svg class="char-svg" viewBox="0 0 200 300">
            <polygon points="45,80 75,75 75,115 45,125 35,95" fill="#252c3c" stroke="#485570" stroke-width="2"/>
            <line x1="48" y1="92" x2="72" y2="88" stroke="#ff1a3c" stroke-width="2"/>
            <polygon points="155,80 125,75 125,115 155,125 165,95" fill="#252c3c" stroke="#485570" stroke-width="2"/>
            <line x1="152" y1="92" x2="128" y2="88" stroke="#ff1a3c" stroke-width="2"/>
            <path d="M 52 118 L 48 165 L 58 172 L 65 122 Z" fill="#1b202c" stroke="#323b4e" stroke-width="1.5"/>
            <path d="M 148 118 L 152 165 L 142 172 L 135 122 Z" fill="#1b202c" stroke="#323b4e" stroke-width="1.5"/>
          </svg>
        </div>

        <!-- LAYER 6: DARK ENERGY SWORD -->
        <div class="rig-layer layer-weapon" id="layerWeapon">
          <svg class="char-svg" viewBox="0 0 200 300">
            <rect x="148" y="166" width="6" height="25" fill="#3a4457" transform="rotate(-25 150 175)"/>
            <rect x="135" y="188" width="32" height="6" rx="2" fill="#222733" stroke="#ff1a3c" stroke-width="1.5" transform="rotate(-25 150 175)"/>
            <path d="M 150 195 L 175 285 L 182 288 L 185 280 L 160 195 Z" 
                  fill="#0d1017" stroke="#ff1a3c" stroke-width="2.5" transform="rotate(-25 150 175)"/>
            <line x1="156" y1="202" x2="178" y2="280" stroke="#ffffff" stroke-width="1.5" transform="rotate(-25 150 175)"/>
          </svg>
        </div>

        <!-- LAYER 7: HELMET & VISOR -->
        <div class="rig-layer layer-head" id="layerHead">
          <svg class="char-svg" viewBox="0 0 200 300">
            <defs>
              <linearGradient id="helmGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#3d475c"/>
                <stop offset="100%" stop-color="#141822"/>
              </linearGradient>
            </defs>
            <polygon points="88,38 112,38 122,60 108,82 100,88 92,82 78,60" fill="url(#helmGrad)" stroke="#4d5a73" stroke-width="2"/>
            <polygon points="84,36 78,16 92,30" fill="#262c3b" stroke="#3d475c"/>
            <polygon points="116,36 122,16 108,30" fill="#262c3b" stroke="#3d475c"/>
          </svg>
        </div>

        <!-- LAYER 8: GLOWING CRIMSON EYES -->
        <div class="rig-layer layer-eyes" id="layerEyes">
          <svg class="char-svg" viewBox="0 0 200 300">
            <polygon points="90,58 98,62 93,64 87,60" fill="#ff2a50" id="leftEye"/>
            <polygon points="110,58 102,62 107,64 113,60" fill="#ff2a50" id="rightEye"/>
            <circle cx="94" cy="61" r="1.5" fill="#fff"/>
            <circle cx="106" cy="61" r="1.5" fill="#fff"/>
          </svg>
        </div>

        <!-- LAYER 9: PLASMA PLUME (HAIR / CREST) -->
        <div class="rig-layer layer-plume" id="layerPlume">
          <svg class="char-svg" viewBox="0 0 200 300">
            <path d="M 100 30 Q 120 10 150 18 Q 170 30 190 70 Q 165 55 140 50 Q 115 45 100 34 Z" 
                  fill="#ff1a3c" opacity="0.9" id="plumePath"/>
            <path d="M 102 32 Q 125 15 152 24 Q 168 38 180 65 Q 160 52 138 46 Z" fill="#ffffff" opacity="0.6"/>
          </svg>
        </div>

      </div>
    </div>

    <!-- CONTEXT MENU (RIGHT-CLICK) -->
    <div class="context-menu" id="contextMenu">
      <div class="context-item" data-action="open-app">
        <span>⚔️</span> Open IGRIS
      </div>
      <div class="context-item" data-action="voice">
        <span>🎙️</span> Voice Command
      </div>
      <div class="context-item" data-action="settings">
        <span>⚙️</span> Settings
      </div>
      <div class="context-divider"></div>
      <div class="context-item" data-action="always-on-top">
        <span>📌</span> <span id="txtAlwaysOnTop">Always on Top ✓</span>
      </div>
      <div class="context-item" data-action="minimize">
        <span>➖</span> Minimize
      </div>
      <div class="context-item item-danger" data-action="exit">
        <span>❌</span> Exit
      </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="settings-modal" id="settingsModal">
      <div class="settings-header">
        <h3>IGRIS COMPANION</h3>
        <button class="btn-close" id="btnCloseSettings">&times;</button>
      </div>
      <div class="settings-body">
        <div class="setting-item">
          <span>Companion Active</span>
          <input type="checkbox" id="chkCompanion" checked>
        </div>
        <div class="setting-item">
          <span>Always On Top</span>
          <input type="checkbox" id="chkAlwaysOnTop" checked>
        </div>
        <div class="setting-item">
          <span>Start with Windows</span>
          <input type="checkbox" id="chkAutoStart">
        </div>
        <div class="setting-item">
          <span>Companion Size</span>
          <select id="selSize">
            <option value="small">Small (160px)</option>
            <option value="medium" selected>Medium (240px)</option>
            <option value="large">Large (320px)</option>
          </select>
        </div>
        <div class="setting-item">
          <span>Opacity (<span id="lblOpacity">100%</span>)</span>
          <input type="range" id="rngOpacity" min="30" max="100" value="100">
        </div>
        <div class="setting-item">
          <span>2.5D Animations</span>
          <input type="checkbox" id="chkAnimation" checked>
        </div>
        <div class="setting-item">
          <span>Phase 9.5 Voice</span>
          <input type="checkbox" id="chkVoice" checked>
        </div>
        <div class="setting-item">
          <span>Phase 12 Hands-Free</span>
          <input type="checkbox" id="chkHandsFree" checked>
        </div>
      </div>
    </div>

  </div>

  <script src="voice.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
