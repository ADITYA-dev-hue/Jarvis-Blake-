<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGRIS Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="companion-root" id="companionRoot">
    
    <!-- DRAGGABLE WRAPPER -->
    <div class="drag-container" id="dragContainer">
      
      <!-- SPEECH / STATUS BUBBLE -->
      <div class="speech-bubble" id="speechBubble">
        <div class="bubble-header">
          <span class="bubble-title">IGRIS</span>
          <span class="bubble-badge badge-connection connecting" id="bubbleConnectionBadge">CONNECTING</span>
          <span class="bubble-badge" id="bubbleStateBadge">IDLE</span>
        </div>
        <div class="bubble-content" id="bubbleContent">Connecting to IGRIS server...</div>
      </div>

      <!-- 2.5D REAL ASSET CHARACTER STAGE (ZERO POLYGON PLACEHOLDERS) -->
      <div class="character-stage floating" id="characterStage">
        <canvas id="particlesCanvas"></canvas>

        <!-- LAYER 1: GROUND AURA EFFECT -->
        <div class="rig-layer layer-aura" id="layerAura">
          <img src="assets/igris/base/effects.png" class="asset-img" alt="Ground Aura" id="imgAura">
        </div>

        <!-- LAYER 2: SHADOW CAPE (BACK) -->
        <div class="rig-layer layer-cape" id="layerCape">
          <img src="assets/igris/base/cape.png" class="asset-img" alt="Shadow Cape" id="imgCape">
        </div>

        <!-- LAYER 3: MAIN 2.5D STATE-SYNCHRONIZED CHARACTER ARTWORK -->
        <div class="rig-layer layer-character" id="layerCharacter">
          <img src="assets/igris/states/idle/character.png" class="asset-img" alt="IGRIS Character" id="imgCharacter">
        </div>

        <!-- LAYER 4: DETAILED ARMORED BODY (LAYERED OVERLAY) -->
        <div class="rig-layer layer-body" id="layerBody">
          <img src="assets/igris/base/body.png" class="asset-img" alt="Armored Body" id="imgBody">
        </div>

        <!-- LAYER 5: FUTURISTIC DARK ENERGY SWORD -->
        <div class="rig-layer layer-sword" id="layerSword">
          <img src="assets/igris/base/sword.png" class="asset-img" alt="Energy Sword" id="imgSword">
        </div>

        <!-- LAYER 6: ARMORED HELMET / HEAD -->
        <div class="rig-layer layer-head" id="layerHead">
          <img src="assets/igris/base/head.png" class="asset-img" alt="Armored Helmet" id="imgHead">
        </div>

        <!-- LAYER 7: GLOWING CRIMSON EYES & VISOR (INDEPENDENT INTENSITY CONTROL) -->
        <div class="rig-layer layer-eyes" id="layerEyes">
          <img src="assets/igris/base/eyes.png" class="asset-img" alt="Crimson Eyes" id="imgEyes">
        </div>

        <!-- LAYER 8: DYNAMIC ENERGY FLUX -->
        <div class="rig-layer layer-energy" id="layerEnergy">
          <img src="assets/igris/particles/energy.png" class="asset-img" alt="Energy Flux" id="imgEnergy">
        </div>

      </div>
    </div>

    <!-- CONTEXT MENU (RIGHT-CLICK) -->
    <div class="context-menu" id="contextMenu">
      <div class="context-item" data-action="open-app">
        <span>⚔️</span> Open IGRIS
      </div>
      <div class="context-item" data-action="voice">
        <span>🎙️</span> Voice Command
      </div>
      <div class="context-item" data-action="settings">
        <span>⚙️</span> Settings
      </div>
      <div class="context-divider"></div>
      <div class="context-item" data-action="always-on-top">
        <span>📌</span> <span id="txtAlwaysOnTop">Always on Top ✓</span>
      </div>
      <div class="context-item" data-action="minimize">
        <span>➖</span> Minimize
      </div>
      <div class="context-item item-danger" data-action="exit">
        <span>❌</span> Exit
      </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="settings-modal" id="settingsModal">
      <div class="settings-header">
        <h3>IGRIS COMPANION</h3>
        <button class="btn-close" id="btnCloseSettings">&times;</button>
      </div>
      <div class="settings-body">
        <div class="setting-item">
          <span>Companion Active</span>
          <input type="checkbox" id="chkCompanion" checked>
        </div>
        <div class="setting-item">
          <span>Always On Top</span>
          <input type="checkbox" id="chkAlwaysOnTop" checked>
        </div>
        <div class="setting-item">
          <span>Start with Windows</span>
          <input type="checkbox" id="chkAutoStart">
        </div>
        <div class="setting-item">
          <span>Companion Size</span>
          <select id="selSize">
            <option value="small">Small (160px)</option>
            <option value="medium" selected>Medium (240px)</option>
            <option value="large">Large (320px)</option>
          </select>
        </div>
        <div class="setting-item">
          <span>Opacity (<span id="lblOpacity">100%</span>)</span>
          <input type="range" id="rngOpacity" min="30" max="100" value="100">
        </div>
        <div class="setting-item">
          <span>2.5D Animations</span>
          <input type="checkbox" id="chkAnimation" checked>
        </div>
        <div class="setting-item">
          <span>Phase 9.5 Voice</span>
          <input type="checkbox" id="chkVoice" checked>
        </div>
        <div class="setting-item">
          <span>Phase 12 Hands-Free</span>
          <input type="checkbox" id="chkHandsFree" checked>
        </div>
      </div>
    </div>

  </div>

  <script src="voice.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
